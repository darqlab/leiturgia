<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leiturgia — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a1628;
      --surface: #111f3a;
      --card:    #162240;
      --border:  #1e2f52;
      --gold:    #d4a843;
      --white:   #f0f2f8;
      --muted:   #6b7fa0;
      --success: #4caf82;
      --error:   #e05252;
      --warn:    #e09652;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      height: 60px;
    }
    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 1.3rem;
      line-height: 1;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--white); }
    header h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--white);
    }

    /* ── Layout ── */
    main {
      max-width: 600px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-body { padding: 1.25rem; }

    /* ── Form fields ── */
    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--gold); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn:not(:disabled):hover { opacity: 0.85; }
    .btn-gold { background: var(--gold); color: #0a1628; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--white);
    }
    .btn-danger {
      background: transparent;
      border: 1px solid #55223a;
      color: var(--error);
    }
    .btn-danger:not(:disabled):hover { background: rgba(224,82,82,0.08); }

    /* ── Status dot ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding-top: 1rem;
      font-size: 0.85rem;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green   { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot-orange  { background: var(--warn);    box-shadow: 0 0 6px var(--warn); }
    .dot-grey    { background: #3a4a5a; }

    /* ── Message banner ── */
    .msg {
      font-size: 0.82rem;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      margin-top: 0.75rem;
      display: none;
    }
    .msg.show { display: block; }
    .msg-ok   { background: rgba(76,175,130,0.12); color: var(--success); border: 1px solid rgba(76,175,130,0.25); }
    .msg-err  { background: rgba(224,82,82,0.12);  color: var(--error);   border: 1px solid rgba(224,82,82,0.25); }
    .msg-warn { background: rgba(224,150,82,0.12); color: var(--warn);    border: 1px solid rgba(224,150,82,0.25); }
    .msg-info { background: rgba(107,127,160,0.12); color: var(--muted);  border: 1px solid rgba(107,127,160,0.25); }
    .msg-alert {
      background: rgba(224,82,82,0.18); color: var(--error);
      border: 1px solid var(--error); font-weight: 500;
    }

    /* ── Separator ── */
    .separator {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  </style>
</head>
<body>

<header>
  <a href="/" class="back-btn" title="Back to console">&#8592;</a>
  <h1>Settings</h1>
</header>

<main>

  <!-- ── Cloud Link ─────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header">Cloud Link</div>
    <div class="card-body">

      <div class="field">
        <label for="cloud-url">Cloud URL</label>
        <input type="text" id="cloud-url" placeholder="ssdgob.leiturgia.cc"
               autocomplete="off" spellcheck="false">
      </div>

      <div class="field">
        <label for="cloud-token">Token</label>
        <input type="text" id="cloud-token" placeholder="ltrg_..."
               autocomplete="off" spellcheck="false">
      </div>

      <div class="actions">
        <button class="btn btn-gold" id="connect-btn" onclick="connectCloud()">Connect</button>
        <button class="btn btn-danger" id="unlink-btn" onclick="unlinkCloud()" style="display:none">Unlink</button>
      </div>

      <div class="msg" id="cloud-msg"></div>

      <div class="status-row">
        <span class="dot" id="status-dot"></span>
        <span id="status-label">Checking…</span>
      </div>

    </div>
  </div>

  <!-- ── PIN ────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header">Operator PIN</div>
    <div class="card-body">
      <div class="field">
        <label for="new-pin">New PIN (4–6 digits)</label>
        <input type="password" id="new-pin" maxlength="6" placeholder="••••"
               inputmode="numeric">
      </div>
      <button class="btn btn-outline" onclick="changePin()">Update PIN</button>
      <div class="msg" id="pin-msg"></div>
    </div>
  </div>

  {% if enable_self_update %}
  <!-- ── App Update ─────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header">App Update</div>
    <div class="card-body">

      <div class="status-row" style="padding-top:0;">
        <span id="update-current-label">Current version: —</span>
      </div>

      <div class="actions" style="margin-top:1rem;">
        <button class="btn btn-outline" id="check-update-btn" onclick="checkForUpdate()">Check for updates</button>
        <button class="btn btn-gold" id="start-update-btn" onclick="showUpdateModal()" style="display:none">Update</button>
      </div>

      <div class="msg" id="update-msg"></div>

    </div>
  </div>
  {% endif %}

</main>

<!-- ── Sync Direction Modal ─────────────────────────────────────────────── -->
<div id="sync-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:100; align-items:center; justify-content:center;">
  <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.75rem; max-width:400px; width:90%; margin:1rem;">
    <p style="font-size:1rem; font-weight:500; margin-bottom:0.4rem; color:var(--white);">Programs found on both sides</p>
    <p style="font-size:0.82rem; color:var(--muted); margin-bottom:1.4rem;">Choose which set to keep. The other side will be replaced.</p>
    <div id="sync-options" style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1.5rem;"></div>
    <button class="btn btn-gold" style="width:100%;" onclick="confirmSync()">Confirm</button>
  </div>
</div>

{% if enable_self_update %}
<!-- ── Update Confirm Modal ─────────────────────────────────────────────── -->
<div id="update-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:100; align-items:center; justify-content:center;">
  <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.75rem; max-width:400px; width:90%; margin:1rem;">
    <p style="font-size:1rem; font-weight:500; margin-bottom:0.4rem; color:var(--white);" id="update-modal-title">Update Leiturgia</p>
    <p style="font-size:0.82rem; color:var(--muted); margin-bottom:1.2rem;" id="update-modal-body"></p>

    <div class="field">
      <label for="update-pin">Confirm PIN</label>
      <input type="password" id="update-pin" maxlength="6" placeholder="••••" inputmode="numeric">
    </div>

    <div class="msg" id="update-modal-msg"></div>

    <div class="actions" style="margin-top:1rem;">
      <button class="btn btn-gold" id="update-confirm-btn" onclick="confirmUpdate()">Confirm</button>
      <button class="btn btn-outline" onclick="hideUpdateModal()">Cancel</button>
    </div>
  </div>
</div>
{% endif %}

<script>
  const $url   = document.getElementById('cloud-url');
  const $token = document.getElementById('cloud-token');
  const $dot   = document.getElementById('status-dot');
  const $label = document.getElementById('status-label');
  const $connectBtn = document.getElementById('connect-btn');
  const $unlinkBtn  = document.getElementById('unlink-btn');

  function showMsg(id, text, ok) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'msg-ok' : 'msg-err');
  }

  function applyStatus(s) {
    $dot.className = 'dot';
    if (s === 'connected') {
      $dot.classList.add('dot-green');
      $label.textContent = 'Connected';
      $unlinkBtn.style.display = 'inline-flex';
      $connectBtn.textContent = 'Reconnect';
    } else if (s === 'reconnecting' || s === 'connecting') {
      $dot.classList.add('dot-orange');
      $label.textContent = s === 'connecting' ? 'Connecting…' : 'Reconnecting…';
      $unlinkBtn.style.display = 'inline-flex';
      $connectBtn.textContent = 'Reconnect';
    } else if (s === 'not_linked') {
      $dot.classList.add('dot-grey');
      $label.textContent = 'Not linked';
      $unlinkBtn.style.display = 'none';
      $connectBtn.textContent = 'Connect';
    } else {
      $dot.classList.add('dot-grey');
      $label.textContent = '—';
    }
  }

  async function loadStatus() {
    try {
      const r = await fetch('/api/cloud/status');
      const d = await r.json();
      if (d.cloud_url)   $url.value   = d.cloud_url;
      if (d.cloud_token) $token.value = d.cloud_token;
      applyStatus(d.status);
    } catch (_) {
      applyStatus('not_linked');
    }
  }

  async function connectCloud() {
    const url   = $url.value.trim().replace(/^https?:\/\//i, '').replace(/\/$/, '');
    const token = $token.value.trim();
    if (!url || !token) {
      showMsg('cloud-msg', 'Both Cloud URL and Token are required.', false);
      return;
    }
    $connectBtn.disabled = true;
    $connectBtn.textContent = 'Connecting…';
    try {
      const r = await fetch('/api/cloud/link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cloud_url: url, cloud_token: token }),
      });
      const d = await r.json();
      if (d.status === 'linked') {
        showMsg('cloud-msg', `Linked to ${d.church_name || 'cloud'} successfully.`, true);
        runSyncCheck();
      } else {
        showMsg('cloud-msg', d.message || 'Failed to connect.', false);
      }
    } catch (_) {
      showMsg('cloud-msg', 'Network error — could not reach the server.', false);
    } finally {
      $connectBtn.disabled = false;
      loadStatus();
    }
  }

  async function unlinkCloud() {
    if (!confirm('Unlink this Pi from the cloud?')) return;
    try {
      const r = await fetch('/api/cloud/unlink', { method: 'POST' });
      const d = await r.json();
      if (d.status === 'ok') {
        $url.value = '';
        $token.value = '';
        showMsg('cloud-msg', 'Unlinked successfully.', true);
      }
    } catch (_) {
      showMsg('cloud-msg', 'Network error.', false);
    }
    loadStatus();
  }

  async function changePin() {
    const pin = document.getElementById('new-pin').value.trim();
    if (!/^\d{4,6}$/.test(pin)) {
      showMsg('pin-msg', 'PIN must be 4–6 digits.', false);
      return;
    }
    try {
      const r = await fetch('/api/settings/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin }),
      });
      if (r.ok) {
        showMsg('pin-msg', 'PIN updated.', true);
        document.getElementById('new-pin').value = '';
      } else {
        const d = await r.json();
        showMsg('pin-msg', d.message || 'Failed to update PIN.', false);
      }
    } catch (_) {
      showMsg('pin-msg', 'Network error.', false);
    }
  }

  // ── Sync dialog ──────────────────────────────────────────────────────────

  let _syncChoice = null;

  function showSyncModal(status) {
    const cloud = status.cloud;
    const pi    = status.pi;
    const fmt   = d => d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
    const pl    = n => n === 1 ? 'program' : 'programs';

    const opts = [
      { value: 'cloud_to_pi', label: `Use Cloud &nbsp;(${cloud.program_count} ${pl(cloud.program_count)} · ${fmt(cloud.updated_at)})` },
      { value: 'pi_to_cloud', label: `Use Pi &nbsp;(${pi.count} ${pl(pi.count)})` },
      { value: 'skip',        label: 'Skip — decide later' },
    ];

    const container = document.getElementById('sync-options');
    container.innerHTML = opts.map((o, i) => `
      <label style="display:flex; align-items:center; gap:0.7rem; cursor:pointer; color:var(--white); font-size:0.88rem; padding:0.5rem 0.6rem; border-radius:8px; border:1px solid var(--border);">
        <input type="radio" name="sync-dir" value="${o.value}" ${i === 0 ? 'checked' : ''} style="accent-color:var(--gold); flex-shrink:0;">
        ${o.label}
      </label>
    `).join('');

    _syncChoice = opts[0].value;
    container.querySelectorAll('input[name="sync-dir"]').forEach(r => {
      r.addEventListener('change', () => { _syncChoice = r.value; });
    });

    document.getElementById('sync-modal').style.display = 'flex';
  }

  async function confirmSync() {
    document.getElementById('sync-modal').style.display = 'none';
    if (_syncChoice === 'skip') {
      showMsg('cloud-msg', 'Sync skipped — programs unchanged.', true);
      return;
    }
    try {
      const r = await fetch('/api/cloud/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction: _syncChoice }),
      });
      const d = await r.json();
      const label = _syncChoice === 'cloud_to_pi'
        ? 'Cloud programs synced to Pi.'
        : 'Pi programs uploaded to cloud.';
      showMsg('cloud-msg', d.ok ? label : (d.error || 'Sync failed.'), d.ok);
    } catch (_) {
      showMsg('cloud-msg', 'Network error during sync.', false);
    }
  }

  async function runSyncCheck() {
    try {
      const r = await fetch('/api/cloud/sync-status');
      const s = await r.json();
      if (!s.linked) return;
      if (s.error || !s.cloud) {
        showMsg('cloud-msg', 'Connected — could not reach cloud for sync check.', true);
        return;
      }
      const piEmpty    = !s.pi.has_data;
      const cloudEmpty = !s.cloud.has_data;
      if (piEmpty && cloudEmpty) {
        showMsg('cloud-msg', 'Connected — no programs to sync yet.', true);
      } else if (cloudEmpty) {
        const r2 = await fetch('/api/cloud/sync', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ direction: 'pi_to_cloud' }),
        });
        const d2 = await r2.json();
        showMsg('cloud-msg', d2.ok ? 'Connected — Pi programs uploaded to cloud.' : (d2.error || 'Auto-sync failed.'), d2.ok);
      } else if (piEmpty) {
        const r2 = await fetch('/api/cloud/sync', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ direction: 'cloud_to_pi' }),
        });
        const d2 = await r2.json();
        showMsg('cloud-msg', d2.ok ? 'Connected — Cloud programs synced to Pi.' : (d2.error || 'Auto-sync failed.'), d2.ok);
      } else {
        showSyncModal(s);
      }
    } catch (_) {
      showMsg('cloud-msg', 'Connected — sync check unavailable.', true);
    }
  }

  {% if enable_self_update %}
  // ── App Update ───────────────────────────────────────────────────────────

  const $updateCurrentLabel = document.getElementById('update-current-label');
  const $checkUpdateBtn     = document.getElementById('check-update-btn');
  const $startUpdateBtn     = document.getElementById('start-update-btn');

  let _updateTargetTag  = null;
  let _updatePollTimer  = null;

  // Plain operator guidance for the `offline` state (TDD §6.4, D5) —
  // no spinner, no error styling: the box is fine, it just can't reach
  // the internet right now.
  const OFFLINE_MSG = 'No internet connection. To update, connect this device to the internet '
                    + '(or bring it to a location with internet) and try again.';

  async function loadCurrentVersion() {
    try {
      const r = await fetch('/api/health');
      const d = await r.json();
      $updateCurrentLabel.textContent = `Current version: ${d.version || 'unknown'}`;
    } catch (_) {
      $updateCurrentLabel.textContent = 'Current version: unknown';
    }
  }

  async function checkForUpdate() {
    $checkUpdateBtn.disabled = true;
    $checkUpdateBtn.textContent = 'Checking…';
    try {
      const r = await fetch('/api/update/check');
      const d = await r.json();
      if (r.status === 503 && d.status === 'offline') {
        const el = document.getElementById('update-msg');
        el.textContent = OFFLINE_MSG;
        el.className = 'msg show msg-info';
        $startUpdateBtn.style.display = 'none';
        _updateTargetTag = null;
        return;
      }
      $updateCurrentLabel.textContent = `Current version: ${d.current || 'unknown'}`;
      if (!d.latest || d.latest === d.current) {
        showMsg('update-msg', 'Up to date.', true);
        _updateTargetTag = null;
        $startUpdateBtn.style.display = 'none';
      } else {
        showMsg('update-msg', `Update available: ${d.latest}`, true);
        _updateTargetTag = d.latest;
        $startUpdateBtn.textContent = `Update to ${d.latest}`;
        $startUpdateBtn.style.display = 'inline-flex';
      }
    } catch (_) {
      showMsg('update-msg', 'Could not check for updates — network error.', false);
    } finally {
      $checkUpdateBtn.disabled = false;
      $checkUpdateBtn.textContent = 'Check for updates';
    }
  }

  function showUpdateModal() {
    if (!_updateTargetTag) return;
    document.getElementById('update-modal-body').textContent =
      `This will update Leiturgia to ${_updateTargetTag} and restart the service. The app will be briefly unavailable.`;
    document.getElementById('update-pin').value = '';
    document.getElementById('update-modal-msg').className = 'msg';
    document.getElementById('update-modal').style.display = 'flex';
  }

  function hideUpdateModal() {
    document.getElementById('update-modal').style.display = 'none';
  }

  async function confirmUpdate() {
    const pin = document.getElementById('update-pin').value.trim();
    if (!/^\d{4,6}$/.test(pin)) {
      showMsg('update-modal-msg', 'Enter your PIN to continue.', false);
      return;
    }
    const $confirmBtn = document.getElementById('update-confirm-btn');
    $confirmBtn.disabled = true;
    try {
      // Re-asserting the operator gate before a destructive action — /login
      // already validates the PIN and refreshes the session, so reusing it
      // avoids a second PIN-check code path.
      const loginResp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin }),
      });
      const loginData = await loginResp.json();
      if (loginData.status !== 'ok') {
        showMsg('update-modal-msg', loginData.message || 'Incorrect PIN.', false);
        return;
      }

      const startResp = await fetch('/api/update/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target_tag: _updateTargetTag }),
      });
      if (startResp.status === 202) {
        hideUpdateModal();
        showMsg('update-msg', `Updating to ${_updateTargetTag}…`, true);
        $startUpdateBtn.disabled = true;
        beginUpdatePolling();
      } else {
        const d = await startResp.json();
        if (startResp.status === 503 && d.status === 'offline') {
          hideUpdateModal();
          const el = document.getElementById('update-msg');
          el.textContent = OFFLINE_MSG;
          el.className = 'msg show msg-info';
        } else {
          showMsg('update-modal-msg', d.message || 'Failed to start update.', false);
        }
      }
    } catch (_) {
      showMsg('update-modal-msg', 'Network error.', false);
    } finally {
      $confirmBtn.disabled = false;
    }
  }

  function beginUpdatePolling() {
    if (_updatePollTimer) return;
    _updatePollTimer = setInterval(pollUpdateStatus, 3000);
  }

  function stopUpdatePolling() {
    if (_updatePollTimer) {
      clearInterval(_updatePollTimer);
      _updatePollTimer = null;
    }
  }

  async function pollUpdateStatus() {
    try {
      const r = await fetch('/api/update/status');
      const d = await r.json();
      if (d.status === 'updating') {
        $startUpdateBtn.disabled = true;
        return;
      }
      stopUpdatePolling();
      $startUpdateBtn.disabled = false;
      if (d.status === 'success') {
        showMsg('update-msg', `Updated to ${d.target_tag || _updateTargetTag}.`, true);
        $startUpdateBtn.style.display = 'none';
        _updateTargetTag = null;
        loadCurrentVersion();
      } else if (d.status === 'reverted') {
        const el = document.getElementById('update-msg');
        el.textContent = 'Update failed health check — reverted to the previous version.';
        el.className = 'msg show msg-warn';
      } else if (d.status === 'revert-failed') {
        const el = document.getElementById('update-msg');
        el.textContent = '⚠️ Manual intervention required — the app may be in an inconsistent state.';
        el.className = 'msg show msg-alert';
      } else if (d.status === 'offline') {
        const el = document.getElementById('update-msg');
        el.textContent = OFFLINE_MSG;
        el.className = 'msg show msg-info';
        $startUpdateBtn.style.display = 'none';
        _updateTargetTag = null;
      }
    } catch (_) {
      // Transient — keep polling; the restart drops the connection briefly.
    }
  }

  loadCurrentVersion();
  {% endif %}

  // Poll status every 5 seconds
  loadStatus();
  setInterval(loadStatus, 5000);
</script>
</body>
</html>
